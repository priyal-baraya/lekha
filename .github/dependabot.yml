# Dependabot opens a pull request when a newer version of a package or a
# GitHub Action is available, including security fixes. Each one runs the
# tests and security checks before anything is merged.

version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
