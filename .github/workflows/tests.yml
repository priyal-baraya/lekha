# Runs every test on GitHub's computers whenever code is pushed or a pull
# request is opened, so a change that breaks something can't slip in
# unnoticed. The result shows as a tick or cross on each commit and PR.

name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v7

      - name: Install Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install packages
        run: python -m pip install -r requirements.txt

      - name: Run the tests
        run: python -m pytest

      # The hosted Lekha talks to Turso through turso.py. Run every test
      # again through it, against a stand-in Turso on local files
      # (tests/fake_turso.py), to check it behaves exactly like sqlite3.
      - name: Run the tests through turso.py
        env:
          LEKHA_TEST_THROUGH_TURSO: "1"
        run: python -m pytest
